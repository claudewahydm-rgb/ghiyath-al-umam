 18px\">أكاديمية وحي<\u002Fdiv>\n      <\u002Fdiv>\n      <nav aria-label=\"أقسام الصفحة\" style=\"display: flex; flex-wrap: wrap; gap: 22px; align-items: center; font-size: 15px\">\n        <a href=\"#about\" style=\"color: #f4eedf; text-decoration: none\">عن الكتاب<\u002Fa>\n        <a href=\"#method\" style=\"color: #f4eedf; text-decoration: none\">منهج القراءة<\u002Fa>\n        <a href=\"#plan\" style=\"color: #f4eedf; text-decoration: none\">خطة المحاضرات<\u002Fa>\n        <a href=\"#details\" style=\"color: #f4eedf; text-decoration: none\">التفاصيل<\u002Fa>\n        <a href=\"https://forms.gle/Z5SJv8XhpgoKGxxd6\" style=\"background: #c3dd55; color: #0c2f3b; text-decoration: none; font-weight: 600; padding: 10px 22px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">سجّل الآن<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section style=\"max-width: 1200px; margin: 0 auto; padding: 72px 24px 88px; display: flex; flex-wrap: wrap; gap: 56px; align-items: center\">\n    <div style=\"flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n      <div style=\"display: inline-flex; align-self: flex-start; gap: 10px; align-items: center; border: 1px solid rgba(195,221,85,0.5); color: #c3dd55; padding: 6px 16px; border-radius: 999px; font-size: 14px; font-weight: 500\">مجلس غياث الأمم · قراءة كاملة للكتاب<\u002Fdiv>\n      <h1 style=\"margin: 0; font-family: 'Alexandria', sans-serif; font-weight: 800; font-size: clamp(34px, 4.6vw, 58px); line-height: 1.35\">ماذا يبقى من الشريعة إذا خلا الزمان <span style=\"color: #c3dd55\">ممن يحملونها؟<\u002Fspan><\u002Fh1>\n      <p style=\"margin: 0; font-size: 19px; color: #d5e0dd; max-width: 560px\">قراءة كاملة في كتاب «غياث الأمم في التياث الظُّلَم» لإمام الحرمين أبي المعالي الجويني (419–478هـ)، بصحبة د. محمد خالد، ضمن مسار الدراسة النظامية في أكاديمية وحي.<\u002Fp>\n      <ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px\">\n        <li style=\"background: rgba(244,238,223,0.08); border-radius: 10px; padding: 8px 14px; font-size: 15px\">الثلاثاء · 7:30 مساءً بتوقيت القاهرة<\u002Fli>\n        <li style=\"background: rgba(244,238,223,0.08); border-radius: 10px; padding: 8px 14px; font-size: 15px\">16 محاضرة<\u002Fli>\n        <li style=\"background: rgba(244,238,223,0.08); border-radius: 10px; padding: 8px 14px; font-size: 15px\">بث مباشر عبر زووم<\u002Fli>\n      <\u002Ful>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding-top: 8px\">\n        <a href=\"https://forms.gle/Z5SJv8XhpgoKGxxd6\" style=\"background: #c3dd55; color: #0c2f3b; text-decoration: none; font-weight: 700; font-size: 18px; padding: 14px 34px; border-radius: 999px; min-height: 52px; box-sizing: border-box; display: inline-flex; align-items: center\">سجّل في المجلس<\u002Fa>\n        <a href=\"#about\" style=\"color: #f4eedf; text-decoration: underline; text-underline-offset: 6px; font-size: 16px; padding: 12px 6px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">تعرّف على الكتاب<\u002Fa>\n      <\u002Fdiv>\n      <p style=\"margin: 0; font-size: 14px; color: #b8c9c6\">يبدأ المجلس عند اكتمال العدد.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex: 1 1 420px; min-width: 0; display: flex; justify-content: center\">\n      <div style=\"position: relative; width: 100%; max-width: 500px\">\n        <div aria-hidden=\"true\" style=\"position: absolute; inset: -18px -18px 18px 18px; border: 1px solid rgba(195,221,85,0.45); border-radius: 28px\"><\u002Fdiv>\n        <img src=\"c89ccc9c-ac1a-4258-9c2f-a9e61647c39f\" alt=\"عمامة فوق كتب على منضدة عتيقة بجوار ريشة ومحبرة، وخلفها مجلس علم\" style=\"position: relative; display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 28px\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"about\" style=\"background: #f4eedf; color: #10303b\">\n    <div style=\"max-width: 1200px; margin: 0 auto; padding: 88px 24px; display: flex; flex-wrap: wrap; gap: 56px\">\n      <div style=\"flex: 1 1 340px; min-width: 0\">\n        <div style=\"font-size: 14px; font-weight: 600; color: #4b6a3a; letter-spacing: 0\">عن الكتاب<\u002Fdiv>\n        <h2 style=\"margin: 10px 0 0; font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: clamp(28px, 3vw, 40px); line-height: 1.4\">كتابٌ كُتب في زمن مضطرب، ويفترض الأسوأ ثم يسأل<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"flex: 2 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 18px; font-size: 18px; color: #2b4750\">\n        <p style=\"margin: 0\">في القرن الخامس الهجري كانت الخلافة العباسية قد فقدت جانبًا كبيرًا من سلطانها الفعلي، وتوزّعت السلطة بين قوى ومراكز متنافسة. في هذا السياق كتب إمام الحرمين الجويني «غياث الأمم في التياث الظُّلَم».<\u002Fp>\n        <p style=\"margin: 0\">والكتاب ليس مصنَّفًا في «الأحكام السلطانية» على طريقة الماوردي؛ إنه تجربة عقل فقهي يُخلي الزمانَ افتراضًا من الإمام، ثم من المجتهد، ثم من حَمَلة المذاهب، ويسأل في كل مرحلة: ما الذي ما زال واجبًا؟ ومن الذي يحمله؟ وبأي دليل؟<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background: #f4eedf; color: #10303b; border-top: 1px solid rgba(16,48,59,0.12)\">\n    <div style=\"max-width: 1200px; margin: 0 auto; padding: 72px 24px 88px; display: flex; flex-direction: column; gap: 36px\">\n      <h2 style=\"margin: 0; font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: clamp(24px, 2.6vw, 34px)\">مراتب خلوّ الزمان كما يتتبّعها الجويني<\u002Fh2>\n      <ol style=\"list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px\">\n        <li style=\"background: #ffffff; border-radius: 18px; padding: 26px; display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"font-family: 'Alexandria', sans-serif; font-weight: 800; font-size: 34px; color: #0c2f3b\">١<\u002Fdiv>\n          <div style=\"font-weight: 600; font-size: 19px\">خلوّ الزمان من الإمام<\u002Fdiv>\n          <div style=\"font-size: 16px; color: #3f5a62\">شغور منصب الإمامة، وما يبقى قائمًا من المصالح حين تغيب السلطة.<\u002Fdiv>\n        <\u002Fli>\n        <li style=\"background: #ffffff; border-radius: 18px; padding: 26px; display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"font-family: 'Alexandria', sans-serif; font-weight: 800; font-size: 34px; color: #0c2f3b\">٢<\u002Fdiv>\n          <div style=\"font-weight: 600; font-size: 19px\">خلوّه من المجتهد المستقل<\u002Fdiv>\n          <div style=\"font-size: 16px; color: #3f5a62\">الاعتماد على نَقَلة المذاهب حين يغيب أهل الاجتهاد.<\u002Fdiv>\n        <\u002Fli>\n        <li style=\"background: #ffffff; border-radius: 18px; padding: 26px; display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"font-family: 'Alexandria', sans-serif; font-weight: 800; font-size: 34px; color: #0c2f3b\">٣<\u002Fdiv>\n          <div style=\"font-weight: 600; font-size: 19px\">خلوّه من حَمَلة المذاهب<\u002Fdiv>\n          <div style=\"font-size: 16px; color: #3f5a62\">الرجوع إلى القواعد الكلية للشريعة.<\u002Fdiv>\n        <\u002Fli>\n        <li style=\"background: #0c2f3b; color: #f4eedf; border-radius: 18px; padding: 26px; display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"font-family: 'Alexandria', sans-serif; font-weight: 800; font-size: 34px; color: #c3dd55\">٤<\u002Fdiv>\n          <div style=\"font-weight: 600; font-size: 19px\">الزمان الأدنى<\u002Fdiv>\n          <div style=\"font-size: 16px; color: #d5e0dd\">التخريج على أصول الشريعة عند اندراس فروع المذاهب.<\u002Fdiv>\n        <\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"method\" style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px; display: flex; flex-wrap: wrap; gap: 56px; align-items: flex-start\">\n    <div style=\"flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n      <div style=\"font-size: 14px; font-weight: 600; color: #c3dd55\">منهج القراءة<\u002Fdiv>\n      <h2 style=\"margin: 0; font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: clamp(28px, 3vw, 40px); line-height: 1.4\">من المحلّ القديم إلى الدولة القومية الحديثة<\u002Fh2>\n      <p style=\"margin: 0; font-size: 18px; color: #d5e0dd\">المحلّ الذي افترضته أحكام السياسة الشرعية الكلاسيكية — الخلافة، والإمام، والأمة الواحدة — حلّت محلّه الدولة القومية الحديثة بسيادتها وتشريعها المركزي وأجهزتها. فهل تنتقل أحكام الجويني إلى هذا المحلّ الجديد كما هي؟ يقرأ المجلس الكتاب بآلة تحقيق المناط، وهي محور القراءة التي يقدّمها د. محمد خالد بوصفها ثمرة أطروحته للدكتوراه.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 14px\">\n      <div style=\"border: 1px solid rgba(244,238,223,0.18); border-radius: 18px; padding: 22px 26px\">\n        <div style=\"font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 20px; color: #c3dd55\">العلّة<\u002Fdiv>\n        <div style=\"font-size: 16px; color: #d5e0dd\">ما الوصف الذي يشتغل عليه الحكم؟<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border: 1px solid rgba(244,238,223,0.18); border-radius: 18px; padding: 22px 26px\">\n        <div style=\"font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 20px; color: #c3dd55\">المصلحة الكلية<\u002Fdiv>\n        <div style=\"font-size: 16px; color: #d5e0dd\">ما المصلحة التي يحتكم إليها، محدودةً بالشرع لا بالتقدير الحرّ؟<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border: 1px solid rgba(244,238,223,0.18); border-radius: 18px; padding: 22px 26px\">\n        <div style=\"font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 20px; color: #c3dd55\">المحلّ<\u002Fdiv>\n        <div style=\"font-size: 16px; color: #d5e0dd\">ما الواقع الذي نُزّل عليه الحكم، موصوفًا وصفًا واقعيًّا لا استعاريًّا؟<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <figure style=\"flex: 1 1 100%; margin: 24px 0 0; padding: 36px 0 0; border-top: 1px solid rgba(244,238,223,0.14)\">\n      <blockquote style=\"margin: 0; font-family: 'Amiri', serif; font-size: clamp(24px, 2.6vw, 32px); line-height: 1.7; color: #f4eedf\">«الكتاب لا يعطينا دستورًا ولا نظامًا للحكم؛ يعطينا طريقة في السؤال.»<\u002Fblockquote>\n      <figcaption style=\"margin-top: 10px; font-size: 15px; color: #b8c9c6\">من خطة المساق<\u002Ffigcaption>\n    <\u002Ffigure>\n  <\u002Fsection>\n\n  <section style=\"background: #082430\">\n    <div style=\"max-width: 1200px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 36px\">\n      <h2 style=\"margin: 0; font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: clamp(26px, 2.8vw, 36px)\">ما الذي يتدرّب عليه الدارس<\u002Fh2>\n      <ul style=\"list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px\">\n        <li style=\"background: #0c2f3b; border-radius: 16px; padding: 22px 24px; font-size: 17px; color: #e3ebe9\">أن يقرأ مقطعًا من الغياثي ويستخرج منه بنية الاستدلال: العلّة، والمصلحة الكلية، والمحلّ المفترض.<\u002Fli>\n        <li style=\"background: #0c2f3b; border-radius: 16px; padding: 22px 24px; font-size: 17px; color: #e3ebe9\">أن يميّز بين القطعيّ في السياسة الشرعية والظنّي فيها، وهو تمييز الجويني نفسه.<\u002Fli>\n        <li style=\"background: #0c2f3b; border-radius: 16px; padding: 22px 24px; font-size: 17px; color: #e3ebe9\">أن يتتبّع مراتب خلوّ الزمان الأربع، ويعرف ما يبقى واجبًا في كل مرتبة ومن يحمله.<\u002Fli>\n        <li style=\"background: #0c2f3b; border-radius: 16px; padding: 22px 24px; font-size: 17px; color: #e3ebe9\">أن يُجري تحقيق مناط كاملًا على مسألة معاصرة واحدة على الأقل.<\u002Fli>\n        <li style=\"background: #0c2f3b; border-radius: 16px; padding: 22px 24px; font-size: 17px; color: #e3ebe9\">أن ينقد نقدًا مسنَدًا القراءةَ التي تجعل الغياثي كتابًا في تبرير سلطة نظام الملك.<\u002Fli>\n        <li style=\"background: #0c2f3b; border-radius: 16px; padding: 22px 24px; font-size: 17px; color: #e3ebe9\">أن يعرف حدود ما يستطيع الغياثي أن يقوله لنا.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"plan\" style=\"background: #f4eedf; color: #10303b\">\n    <div style=\"max-width: 1200px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 36px\">\n      <div style=\"display: flex; flex-direction: column; gap: 8px\">\n        <div style=\"font-size: 14px; font-weight: 600; color: #4b6a3a\">خطة المحاضرات<\u002Fdiv>\n        <h2 style=\"margin: 0; font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: clamp(26px, 2.8vw, 36px)\">ستّ عشرة محاضرة على أركان الكتاب<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px\">\n        <div style=\"background: #ffffff; border-radius: 18px; padding: 26px; display: flex; flex-direction: column; gap: 12px\">\n          <div style=\"font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 18px\">المدخل والركن الأول: الإمامة<\u002Fdiv>\n          <ol start=\"1\" style=\"margin: 0; padding-inline-start: 22px; font-size: 15.5px; color: #3f5a62; display: flex; flex-direction: column; gap: 6px\">\n            <li>المدخل إلى الكتاب وإمام الحرمين وسياقه الفكري والسياسي<\u002Fli>\n            <li>مفهوم الإمامة وحكم إقامتها في الشرع<\u002Fli>\n            <li>الشروط والصفات الواجب توافرها في الإمام<\u002Fli>\n            <li>طرق انعقاد الإمامة وأحكام أهل الحل والعقد<\u002Fli>\n            <li>بيعة المفضول وعزل الإمام وحكم طروء الفسق<\u002Fli>\n            <li>واجبات الإمام في حفظ الدين وسد الثغور<\u002Fli>\n            <li>النظام المالي لبيت المال وحقوق الرعية<\u002Fli>\n            <li>أحكام الولاية والقضاء وتنظيم الإيالات<\u002Fli>\n          <\u002Fol>\n        <\u002Fdiv>\n        <div style=\"background: #ffffff; border-radius: 18px; padding: 26px; display: flex; flex-direction: column; gap: 12px\">\n          <div style=\"font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 18px\">الركن الثاني: خلوّ الزمان عن الأئمة<\u002Fdiv>\n          <ol start=\"9\" style=\"margin: 0; padding-inline-start: 22px; font-size: 15.5px; color: #3f5a62; display: flex; flex-direction: column; gap: 6px\">\n            <li>خلو الزمان عن الأئمة وتكييف شغور المنصب<\u002Fli>\n            <li>الاستيلاء بالشوكة وتصرفات ذي النجدة<\u002Fli>\n            <li>تنظيم الأمة لشؤونها عند غياب السلطة<\u002Fli>\n          <\u002Fol>\n        <\u002Fdiv>\n        <div style=\"background: #ffffff; border-radius: 18px; padding: 26px; display: flex; flex-direction: column; gap: 12px\">\n          <div style=\"font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: 18px\">الركن الثالث: خلوّ الزمان عن المجتهدين<\u002Fdiv>\n          <ol start=\"12\" style=\"margin: 0; padding-inline-start: 22px; font-size: 15.5px; color: #3f5a62; display: flex; flex-direction: column; gap: 6px\">\n            <li>خلوه عن المجتهدين المطلقين: المرتبة الأولى<\u002Fli>\n            <li>الاعتماد على نقلة المذاهب: المرتبة الثانية<\u002Fli>\n            <li>الرجوع إلى القواعد الكلية: المرتبة الثالثة<\u002Fli>\n            <li>التخريج على أصول الشريعة: المرتبة الرابعة<\u002Fli>\n            <li>مراجعة عامة وتقويم الفكر المقاصدي والسياسي في «الغياثي»<\u002Fli>\n          <\u002Fol>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"details\" style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px; display: flex; flex-wrap: wrap; gap: 48px; align-items: center\">\n    <div style=\"flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 18px\">\n      <h2 style=\"margin: 0; font-family: 'Alexandria', sans-serif; font-weight: 700; font-size: clamp(28px, 3vw, 40px); line-height: 1.4\">تفاصيل الالتحاق<\u002Fh2>\n      <p style=\"margin: 0; font-size: 18px; color: #d5e0dd\">املأ استمارة التسجيل، ويتواصل معك فريق الأكاديمية بتفاصيل الانضمام. يبدأ المجلس عند اكتمال العدد.<\u002Fp>\n      <a href=\"https://forms.gle/Z5SJv8XhpgoKGxxd6\" style=\"align-self: flex-start; background: #c3dd55; color: #0c2f3b; text-decoration: none; font-weight: 700; font-size: 18px; padding: 14px 34px; border-radius: 999px; min-height: 52px; box-sizing: border-box; display: inline-flex; align-items: center\">افتح استمارة التسجيل<\u002Fa>\n    <\u002Fdiv>\n    <dl style=\"flex: 1 1 440px; min-width: 0; margin: 0; background: #f4eedf; color: #10303b; border-radius: 22px; padding: 12px 28px; display: flex; flex-direction: column\">\n      <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 16px 0; border-bottom: 1px solid rgba(16,48,59,0.12)\"><dt style=\"color: #3f5a62\">المحاضر<\u002Fdt><dd style=\"margin: 0; font-weight: 600\">د. محمد خالد<\u002Fdd><\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 16px 0; border-bottom: 1px solid rgba(16,48,59,0.12)\"><dt style=\"color: #3f5a62\">الموعد<\u002Fdt><dd style=\"margin: 0; font-weight: 600\">الثلاثاء أسبوعيًا · 7:30 مساءً بتوقيت القاهرة<\u002Fdd><\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 16px 0; border-bottom: 1px solid rgba(16,48,59,0.12)\"><dt style=\"color: #3f5a62\">عدد المحاضرات<\u002Fdt><dd style=\"margin: 0; font-weight: 600\">16 محاضرة<\u002Fdd><\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 16px 0; border-bottom: 1px solid rgba(16,48,59,0.12)\"><dt style=\"color: #3f5a62\">المكان<\u002Fdt><dd style=\"margin: 0; font-weight: 600\">بث مباشر وتفاعلي عبر زووم<\u002Fdd><\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 16px 0; border-bottom: 1px solid rgba(16,48,59,0.12)\"><dt style=\"color: #3f5a62\">الكتاب<\u002Fdt><dd style=\"margin: 0; font-weight: 600\">غياث الأمم في التياث الظُّلَم – للجويني<\u002Fdd><\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 16px 0; border-bottom: 1px solid rgba(16,48,59,0.12)\"><dt style=\"color: #3f5a62\">قيمة الاشتراك<\u002Fdt><dd style=\"margin: 0; font-weight: 600\">350 ج.م شهريًا · 35$<\u002Fdd><\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 16px 0\"><dt style=\"color: #3f5a62\">موعد البدء<\u002Fdt><dd style=\"margin: 0; font-weight: 600\">عند اكتمال العدد<\u002Fdd><\u002Fdiv>\n    <\u002Fdl>\n  <\u002Fsection>\n\n  <footer style=\"background: #082430; border-top: 1px solid rgba(244,238,223,0.12)\">\n    <div style=\"max-width: 1200px; margin: 0 auto; padding: 32px 24px; display: flex; flex-wrap: wrap; gap: 16px 32px; justify-content: space-between; align-items: center; font-size: 15px; color: #b8c9c6\">\n      <div style=\"font-family: 'Alexandria', sans-serif; font-weight: 700; color: #f4eedf\">أكاديمية وحي<\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n        <span>واتساب: <span dir=\"ltr\">02 010 9974 4228<\u002Fspan><\u002Fspan>\n        <span>فيسبوك: <span dir=\"ltr\">Wahy.for.learning<\u002Fspan><\u002Fspan>\n        <span>إنستغرام: <span dir=\"ltr\">Wahy academy2020<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:5200}}\">\nclass Component extends DCLogic {\nrenderVals() {\nreturn {};\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
